name: Claude Code Review (Issue)
on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Detect Language
        id: detect
        uses: ./.github/actions/detect-language

      - name: Setup Claude
        id: setup
        shell: bash
        run: |
          if ! command -v claude &> /dev/null; then
            echo "::notice::Claude CLI not installed — skipping Claude review"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Run Claude Review
        if: steps.setup.outputs.skip != 'true'
        shell: bash
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          claude code review --diff "$ISSUE_BODY"
