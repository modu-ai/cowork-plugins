baseURL = "https://cowork.mo.ai.kr/"
title = "모두의 코워크"
languageCode = "ko-KR"
defaultContentLanguage = "ko"
hasCJKLanguage = true
enableGitInfo = true
enableRobotsTXT = true
theme = "hugo-geekdoc"

# Geekdoc 권장 설정
pluralizeListTitles = false
disablePathToLower = true

# 코드 하이라이팅
[markup]
  [markup.goldmark.renderer]
    unsafe = true
  [markup.tableOfContents]
    startLevel = 1
    endLevel = 9
  [markup.highlight]
    style = "tokyonight-night"
    lineNos = false
    noClasses = false

# 최종 수정일 결정 순서 — frontmatter 의 lastmod 를 git 보다 우선한다.
# (기본값은 :git 이 먼저라, 아직 커밋되지 않은 새 문서가 0001.01.01 로 표시됨)
[frontmatter]
  lastmod = ['lastmod', ':git', 'date', 'publishDate']

# Geekdoc 권장 미디어 타입
[outputs]
  home = ["HTML", "RSS", "SEARCH", "SITEMAP"]
  page = ["HTML"]
  section = ["HTML", "RSS"]

[outputFormats]
  [outputFormats.SEARCH]
    baseName = "search"
    isPlainText = true
    mediaType = "application/json"
    notAlternative = true
  [outputFormats.SITEMAP]
    baseName = "sitemap"
    isPlainText = true
    mediaType = "application/xml"
    notAlternative = true

[mediaTypes]
  [mediaTypes."application/xml"]
    suffixes = ["xml"]

# Geekdoc 사이트 파라미터
[params]
  # ⚠️ SSOT — moai-cowork(마켓플레이스·문서) 자체 버전. 이 두 줄만 갱신하면
  # 홈 히어로·version-badge 등 모든 표시 위치에 자동 반영된다.
  #
  # 이 버전은 **플러그인 버전과 독립**이다 (2026-07-31 체계 재정립).
  #   · 사이트/문서/마켓플레이스 구조가 바뀔 때만 여기를 올린다
  #   · 플러그인 하나를 고쳤다면 그 플러그인의 plugin.json +
  #     .claude-plugin/marketplace.json 해당 entry 만 올린다 (여기는 그대로)
  # 규칙 SSOT: CLAUDE.local.md § 버저닝 규칙
  version = "1.2.5"
  releaseDate = "2026-07-31"
  geekdocRepo = "https://github.com/modu-ai/moai-cowork"
  geekdocEditPath = "edit/main/content"
  geekdocSearch = true
  geekdocSearchShowParent = true
  geekdocLegalNotice = "https://github.com/modu-ai/moai-cowork"
  geekdocPrivacyPolicy = "/about/"
  geekdocToC = 3
  geekdocBreadcrumb = true
  geekdocNextPrev = true
  geekdocTagsToMenu = true
  geekdocFileTreeSortBy = "weight"
  geekdocCollapseSection = false
  # 디자인 standalone 사이드바와 매칭: data/menu/main.yaml 기반 메뉴 사용
  geekdocMenuBundle = true
  # Mermaid 다이어그램 활성화 (flowchart, sequence, etc.)
  geekdocMermaid = true

  # 사이트 메타
  description = "Claude Desktop으로 시작하는 AI 활용 완전 가이드. Chat · Cowork · Design · Code — 4가지 Claude 제품을 한곳에서. 10~60대 비개발자 입문자를 위한 한국어 학습 허브."
  author = "modu-ai"

  # 라이트 모드 고정
  geekdocDarkModeDefault = false
  geekdocDarkModeToggle = false

  # MoAI 브랜드 에셋
  geekdocImage = "moai-logo.png"
  # og:image 기본값 (1200x630, 페이지 frontmatter의 images 로 오버라이드 가능)
  images = ["moai-cowork-og.jpg"]
  # Facebook App ID — Facebook Insight 연동 시 설정 (비워도 og 메타에 영향 없음)
  fbAppID = ""
  [params.geekdocFontAwesome]
    url = "https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6/css/all.min.css"
