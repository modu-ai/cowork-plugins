[project]
name = "moai-mcp-youtube"
version = "0.1.0"
description = "YouTube Data API v3 · Live Streaming API · Analytics API MCP 서버 — 라이브 방송 운영·업로드·발행·성과 조회·댓글 관리 (moai-cowork moai-youtuber)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "모두의 AI", email = "email@mo.ai.kr" }]
keywords = ["mcp", "youtube", "live-streaming", "analytics", "유튜브", "model-context-protocol"]
dependencies = [
    # 다른 자체 제작 서버와 같은 선상(1.x, FastMCP)으로 고정.
    "mcp>=1.2.0,<2.0",
    "httpx>=0.27.0",
]

[project.scripts]
moai-mcp-youtube = "moai_mcp_youtube.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/moai_mcp_core", "src/moai_mcp_youtube"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
