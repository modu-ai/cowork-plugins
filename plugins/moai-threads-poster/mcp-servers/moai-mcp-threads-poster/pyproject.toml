[project]
name = "moai-mcp-threads-poster"
version = "0.1.0"
description = "Threads(Meta) Graph API 자동 포스팅 MCP — 텍스트·이미지·비디오 2단계 발행. OAuth2 Bearer token."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "modu-ai" }]
keywords = ["mcp", "threads", "meta", "스레드", "autoposting", "model-context-protocol"]
dependencies = [
    # moai-seller/moai-imweb 와 동일 선상(1.x, FastMCP) 으로 고정.
    # mcp 2.0 은 FastMCP 가 분리된 별도 API — 본 플러그인은 moai-imweb 패턴을 따른다.
    "mcp>=1.2.0,<2.0",
    "httpx>=0.27.0",
]

[project.scripts]
moai-mcp-threads-poster = "moai_mcp_threads_poster.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/moai_mcp_threads_poster"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]
